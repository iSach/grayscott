[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grayscott"
version = "0.1.0"
description = "Gray-Scott simulator and a small specialist emulator, built to test normalisation and output-constraint choices"
requires-python = ">=3.10"
dependencies = ["numpy", "torch", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest"]
lab = ["pandas", "jupyter"]
# arch="walrus" also needs the official code, installed without its pinned dependencies:
#   pip install --no-deps git+https://github.com/PolymathicAI/walrus.git
walrus = ["the_well", "einops", "hydra-core", "timm"]

[tool.setuptools]
packages = ["grayscott"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
